name: Build Trenches Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🐍 Install Python (required for node-gyp)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 🔥 FORCE native modules to build (this is the key fix)
      - name: Install dependencies (force rebuild)
        run: |
          npm config set build_from_source true
          npm install

      # 🔍 Debug step (see if folder exists at all)
      - name: Debug better-sqlite3 folder
        run: dir node_modules\better-sqlite3

      # 🔍 Verify native binary exists
      - name: Verify better-sqlite3 binary
        run: |
          if (!(Test-Path "node_modules/better-sqlite3/build/Release/better_sqlite3.node")) {
            Write-Host "ERROR: better-sqlite3 binary missing!"
            exit 1
          }

      # 📦 Build EXE
      - name: Build EXE
        run: npx pkg . --targets node18-win-x64 --output TrenchesAgent.exe

      # 📁 Prepare final package
      - name: Prepare package
        run: |
          mkdir TrenchesAgent
          move TrenchesAgent.exe TrenchesAgent\

          mkdir TrenchesAgent\node_modules\better-sqlite3\build\Release

          copy node_modules\better-sqlite3\build\Release\better_sqlite3.node `
          TrenchesAgent\node_modules\better-sqlite3\build\Release\

      # 🗜️ Zip package
      - name: Zip package
        run: powershell Compress-Archive -Path TrenchesAgent -DestinationPath TrenchesAgent-win64.zip

      # ☁️ Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrenchesAgent-win64
          path: TrenchesAgent-win64.zip
